<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380">
  <style> .box{fill:#f8f9fa;stroke:#2b6cb0;stroke-width:2} .diamond{fill:#fff3bf;stroke:#d97706;stroke-width:2} .text{font-family:Arial, Helvetica, sans-serif;font-size:14px;fill:#111827}</style>

  <rect x="40" y="30" width="150" height="40" rx="6" class="box"/>
  <text x="115" y="55" text-anchor="middle" class="text">Başla</text>

  <rect x="40" y="100" width="220" height="40" rx="6" class="box"/>
  <text x="150" y="125" text-anchor="middle" class="text">JSON dosyası oku</text>

  <rect x="40" y="170" width="260" height="40" rx="6" class="box"/>
  <text x="170" y="195" text-anchor="middle" class="text">Veri yapısını analiz et</text>

  <polygon points="340,190 420,160 420,220" class="diamond"/>
  <text x="385" y="190" text-anchor="middle" class="text">İç içe nesne var mı?</text>

  <rect x="480" y="140" width="140" height="40" rx="6" class="box"/>
  <text x="550" y="165" text-anchor="middle" class="text">Alt tablo oluştur</text>

  <rect x="480" y="220" width="160" height="40" rx="6" class="box"/>
  <text x="560" y="245" text-anchor="middle" class="text">Alan tiplerini eşle</text>

  <rect x="200" y="260" width="300" height="40" rx="6" class="box"/>
  <text x="350" y="285" text-anchor="middle" class="text">SQL ifadelerini oluştur ve çıkışa yaz</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <line x1="115" y1="70" x2="150" y2="100" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="140" x2="170" y2="170" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="190" x2="340" y2="190" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="170" x2="480" y2="160" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="210" x2="520" y2="240" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="210" x2="360" y2="260" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
</svg>